name: cartepro

services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-3001}:3000"
    environment:
      - PORT=3000
      - DATABASE_HOST=${DATABASE_HOST:-postgres}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DATABASE_USER=${DATABASE_USER:-cartepro}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-cartepro}
      - DATABASE_NAME=${DATABASE_NAME:-cartepro}
      - DATABASE_LOGGING=${DATABASE_LOGGING:-false}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_PORT=${DATABASE_PORT:-5432}
      - POSTGRES_USER=${DATABASE_USER:-cartepro}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-cartepro}
      - POSTGRES_DB=${DATABASE_NAME:-cartepro}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cartepro -d cartepro']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  postgres-data:
