name: cartepro

services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    expose:
      - 3000

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      - DATABASE_HOST=${DATABASE_HOST:-postgres}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DATABASE_USER=${DATABASE_USER:-cartepro}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-cartepro}
      - DATABASE_NAME=${DATABASE_NAME:-cartepro}
      - DATABASE_LOGGING=${DATABASE_LOGGING:-false}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET, e.g. openssl rand -base64 32}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:?set BETTER_AUTH_URL to the public URL of the API}
      - AUTH_TRUSTED_ORIGINS=${AUTH_TRUSTED_ORIGINS:?set AUTH_TRUSTED_ORIGINS to the origins allowed to sign in}
    expose:
      - 3000
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_PORT=${DATABASE_PORT:-5432}
      - POSTGRES_USER=${DATABASE_USER:-cartepro}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-cartepro}
      - POSTGRES_DB=${DATABASE_NAME:-cartepro}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cartepro -d cartepro']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  postgres-data:
