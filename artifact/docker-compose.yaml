name: cartepro

services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - --api.insecure=true
      - --entrypoints.web.address=:80
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false

  frontend:
    image: cartepro-frontend
    environment:
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://backend:3000}
      - APP_ORIGIN=${APP_ORIGIN:-http://cartepro.localhost}
    labels:
      - traefik.enable=true
      - traefik.http.routers.front.entrypoints=web
      - traefik.http.routers.front.rule=Host(`cartepro.localhost`)
      - traefik.http.routers.front.priority=1
      - traefik.http.services.front.loadbalancer.server.port=3000

  backend:
    image: cartepro-backend
    environment:
      - DATABASE_HOST=${DATABASE_HOST:-postgres}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DATABASE_USER=${DATABASE_USER:-cartepro}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-cartepro}
      - DATABASE_NAME=${DATABASE_NAME:-cartepro}
      - DATABASE_LOGGING=${DATABASE_LOGGING:-false}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.back.entrypoints=web
      - traefik.http.routers.back.rule=Host(`cartepro.localhost`) && (PathPrefix(`/api`) || PathPrefix(`/docs`) || Path(`/health`))
      - traefik.http.routers.back.priority=100
      - traefik.http.services.back.loadbalancer.server.port=3000

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DATABASE_USER:-cartepro}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-cartepro}
      - POSTGRES_DB=${DATABASE_NAME:-cartepro}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-cartepro} -d ${DATABASE_NAME:-cartepro}' ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  postgres-data:
