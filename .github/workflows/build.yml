name: Build and Package Artifact
on:
  push:
    branches: [main, master]

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker images
        run: |
          docker build -t cartepro-backend -f apps/backend/Dockerfile .
          docker build -t cartepro-frontend -f apps/frontend/Dockerfile .

      - name: Prepare artifact package
        run: |
          # Copy artifact/ to release/
          cp -r artifact/ release/

          # Save docker images
          docker save cartepro-backend:latest cartepro-frontend:latest | gzip > release/docker-images.tar.gz

          # Set execution permissions
          chmod +x release/start.sh

      - name: Generate .env
        run: |
          # Start from the documented defaults, then override only what the
          # artifact's docker-compose network needs, so the same file stays
          # the single source of truth for what a deployment expects.
          cp .env.example release/.env

          sed -i \
            -e 's|^NODE_ENV=.*|NODE_ENV=production|' \
            -e 's|^DATABASE_HOST=.*|DATABASE_HOST=postgres|' \
            -e 's|^DATABASE_LOGGING=.*|DATABASE_LOGGING=false|' \
            -e 's|^BETTER_AUTH_URL=.*|BETTER_AUTH_URL=https://cartepro.localhost|' \
            -e 's|^AUTH_TRUSTED_ORIGINS=.*|AUTH_TRUSTED_ORIGINS=https://cartepro.localhost|' \
            -e 's|^APP_ORIGIN=.*|APP_ORIGIN=https://cartepro.localhost|' \
            -e 's|^BACKEND_INTERNAL_URL=.*|BACKEND_INTERNAL_URL=http://backend:3000|' \
            release/.env

          # Each build ships its own signing secrets; never the .env.example placeholder.
          for secret in BETTER_AUTH_SECRET PAYMENT_TOKEN_SIGNING_SECRET AUDIT_EXPORT_SIGNING_SECRET; do
            value=$(openssl rand -base64 32)
            sed -i "s|^${secret}=.*|${secret}=${value}|" release/.env
          done

      - name: Generate local HTTPS certificate
        run: |
          # Self-signed, scoped to cartepro.localhost only: it backs Traefik's
          # TLS termination for the artifact and is regenerated on every build,
          # the same way the signing secrets above are — never committed, so
          # no private key ever sits in source control.
          mkdir -p release/certs
          openssl req -x509 -nodes -newkey rsa:2048 -days 825 \
            -keyout release/certs/cartepro.localhost.key \
            -out release/certs/cartepro.localhost.crt \
            -subj "/CN=cartepro.localhost" \
            -addext "subjectAltName=DNS:cartepro.localhost"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cartepro-livrable
          path: release/
          retention-days: 14
