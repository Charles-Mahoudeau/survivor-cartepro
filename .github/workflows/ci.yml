name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a branch cancels the run still going for the previous one:
# nothing downstream depends on the outcome of a commit that has been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      # Every task runs to completion even when one fails, so a single review
      # shows the full picture instead of only the first thing that broke.
      fail-fast: false
      matrix:
        task: [format:check, lint:check, typecheck, test, build]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.task }}
        run: bun run ${{ matrix.task }}
