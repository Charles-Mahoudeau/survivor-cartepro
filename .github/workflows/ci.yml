name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push cancels the run still going for the commit it replaced. Every
# task runs to completion so one review shows every failure.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { task: format:check, shell: ci }
          - { task: lint:check, shell: ci }
          - { task: typecheck, shell: ci }
          # Les deux tâches qui exigent un vrai node : sous celui de bun,
          # `next build` et jest-runtime cassent tous les deux.
          - { task: build, shell: ci-node }
          - { task: test, shell: ci-node }

    steps:
      - uses: actions/checkout@v5

      # La chaîne d'outils vient du flake, donc de flake.lock : la CI, le
      # devShell et l'image tournent sur les mêmes versions de bun et de node.
      #
      # nix-quick-install déballe un nix préconstruit plutôt que de le
      # compiler, et `keep-outputs` retient les dépendances du devShell dans le
      # magasin pour qu'elles soient mises en cache à l'étape suivante.
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      # Le magasin nix du job précédent, restauré tel quel : rien à retélécharger
      # depuis cache.nixos.org tant que flake.lock ne bouge pas.
      - name: Restore Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ matrix.shell }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ matrix.shell }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ matrix.shell }}-
          purge-created: 0
          purge-primary-key: never

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: nix develop .#${{ matrix.shell }} --command bun install --frozen-lockfile

      - name: Run ${{ matrix.task }}
        run: nix develop .#${{ matrix.shell }} --command bun run ${{ matrix.task }}
