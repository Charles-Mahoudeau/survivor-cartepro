name: Mirror

on:
  push:
    branches: [main]

env:
  REPOSITORY: EpitechPGE3-2026/G-SVR-500-NAN-5-1-survivor-3
  REPOSITORY_URL: git@github.com:EpitechPGE3-2026/G-SVR-500-NAN-5-1-survivor-3.git

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror:
    if: github.repository != env.REPOSITORY
    name: Mirror repository to Epitech GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Mirror repository
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ env.REPOSITORY_URL }}
          ssh_private_key: ${{ secrets.REPOSITORY_SSH_PRIVATE_KEY }}
